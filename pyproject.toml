[project]
name = "cvforge"
version = "0.1.0"
description = "Data-first CV generator: one YAML source, A4 PDF and HTML fragment targets"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dominik Wüst", email = "kontakt@dom-wuest.de" }]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "jinja2>=3.1",
    "watchfiles>=0.24",
]

[project.scripts]
cvforge = "cvforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvforge"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
