body:
  - >
    Your posting asks for a rendering engineer who is as comfortable in a GPU
    profiler as in a paper on neural rendering. That combination is where I
    have spent the last years, and it is why I would like to join the
    real-time graphics team at ACME.
  - >
    In my master's thesis at KIT I built a pipeline that replaces expensive
    shader functions with tiny neural networks and symbolic expressions -
    fitted automatically, and validated by rendering the shader end to end.
    At KIT's IVD I integrated the Falcor renderer into an LLM-driven shader
    optimization pipeline that found speedups of up to 2.19×; the work is now
    a co-authored paper under submission.
  - >
    Before that I spent four and a half years as a research assistant at
    Fraunhofer IOSB, deploying deep learning models in C++ with ONNX Runtime,
    shipping cross-platform software and maintaining its CI/CD pipelines. I
    am used to code that has to run on someone else's machine, not only on
    mine.
  - >
    I would welcome the chance to talk about how I could contribute to your
    renderer, and look forward to hearing from you.

