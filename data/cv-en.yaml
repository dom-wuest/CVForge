    role: "Research Assistant"
    org: "Fraunhofer IOSB"
    location: "Karlsruhe, Germany"
    start: "2021-10"
    end: "2026-03"
    highlights:
      - >
        Applied pretrained computer vision models for object detection,
        segmentation, image retrieval, and vision-language embeddings to
        accelerate Structure-from-Motion pipelines
      - >
        Deployed deep learning models in C++ using ONNX Runtime and clip.cpp,
        converting models to ONNX and modifying computation graphs to support
        dynamic batch sizes and image resolutions
      - >
        Developed and shipped cross-platform software and maintained CI/CD
        pipelines using GitLab and Docker
    tags: ["C++", "Qt", "OpenCV", "ONNX Runtime"]

  - id: kit-ivd
    role: "Research Assistant"
    org: "Karlsruhe Institute of Technology (IVD)"
    location: "Karlsruhe, Germany"
    start: "2025-05"
    end: "2025-08"
    highlights:
      - >
        Contributed to a LLM-based shader optimization pipeline by integrating
        the Falcor renderer and adding support for cooperative vector
        acceleration
      - "Designed related LLM prompts and analyzed proposed optimizations automatically"
      - "Co-author on related paper under submission"
    tags: ["Python", "C++", "Slang"]

  - id: kit-capp
    role: "Student Assistant"
    org: "Karlsruhe Institute of Technology (CAPP)"
    location: "Karlsruhe, Germany"
    start: "2020-11"
    end: "2021-07"
    highlights:
      - "Tutored a group of students in computer engineering"
      - >
        Courses in fundamentals of microelectronics, design and construction of
        logic circuits
    tags: ["LaTeX", "C", "Presentations"]

