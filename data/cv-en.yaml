# yaml-language-server: $schema=../schema/cv.schema.json
#
# English CV content. See README.md for the full format reference.
#
# Three rules that bite:
#   1. Dates are QUOTED strings, "YYYY" or "YYYY-MM". Quoting keeps the type
#      predictable: unquoted, YAML leaves 2021-10 a string but turns a full
#      2021-10-01 into a date object, and the two look identical in a diff.
#   2. Quote anything YAML 1.1 coerces. `no`/`on`/`off`/`yes` become booleans,
#      and `grade: 1.20` becomes the float 1.2 - which would render as "1.2".
#   3. Store data, not presentation. grade: "1.2" + grade_note: current,
#      never "Current Grade 1.2". The renderers compose display strings.
#
# `cvforge check` catches all three - the schema requires strings.
#
# Entry order here is display order. Nothing is sorted downstream.

meta:
  lang: en
  name: "Dominik Wüst"
  tagline: "M.Sc. Computer Science – Machine Learning & Rendering Engineer"
  photo: "assets/avatar.jpg"

contacts:
  # `id` is the join key with data/private.yaml.
  # `icon` is a Font Awesome name, shared by both renderers.
  - id: email
    icon: envelope
    value: "kontakt@dom-wuest.de"
    url: "mailto:kontakt@dom-wuest.de"

  - id: phone
    icon: phone
    value: "+49 000 0000000" # placeholder; real number in private.yaml
    private: hidden # dropped entirely from the public/HTML profile

  - id: location
    icon: location-dot
    value: "Karlsruhe, DE" # publishable as-is
    private: refine # private.yaml refines this to the full street address

  - id: linkedin
    icon: linkedin
    brand: true
    value: "dom-wuest"
    url: "https://linkedin.com/in/dom-wuest"

  - id: github
    icon: github
    brand: true
    value: "dom-wuest"
    url: "https://github.com/dom-wuest"

  - id: website
    icon: globe
    value: "dom-wuest.de"
    url: "https://dom-wuest.de"

profile: >
  Computer Science graduate specializing in real-time computer graphics, GPU
  programming and machine learning. Experienced in C++, Vulkan and Python
  through research at KIT and Fraunhofer IOSB. Interested in neural rendering,
  differentiable graphics and computer vision.

