# yaml-language-server: $schema=../schema/cv.schema.json
#
# Deutscher Lebenslauf.
#
# Struktur, Daten und ids sind identisch zu cv-en.yaml und fertig verdrahtet -
# `uv run cvforge pdf --lang de` baut sofort. Was fehlt, ist die Übersetzung
# der Fließtexte: jede noch englische Stelle ist mit "TODO übersetzen:"
# markiert, sodass sie im PDF sofort ins Auge fällt.
#
# Die englische Originalfassung steht jeweils dahinter - beim Übersetzen
# einfach das "TODO übersetzen: " samt englischem Text ersetzen.
#
# Die drei Fallstricke aus cv-en.yaml gelten unverändert:
#   1. Daten sind ZITIERTE Strings, "YYYY" oder "YYYY-MM".
#   2. `no`/`on`/`off`/`ja` und `note: 1,20` werden von YAML umgedeutet.
#   3. Daten speichern, keine Darstellung: grade: "1,2" + grade_note: current.
#
# private.yaml wird von allen Sprachen geteilt - hier nichts zu tun.

meta:
  lang: de
  name: "Dominik Wüst"
  tagline: "M.Sc. Informatik – Machine Learning & Rendering Engineer"
  photo: "assets/avatar.jpg"

contacts:
  - id: email
    icon: envelope
    value: "kontakt@dom-wuest.de"
    url: "mailto:kontakt@dom-wuest.de"

  - id: phone
    icon: phone
    value: "+49 000 0000000"
    private: hidden

  - id: location
    icon: location-dot
    value: "Karlsruhe, DE"
    private: refine

  - id: linkedin
    icon: linkedin
    brand: true
    # The domain earns its place: on paper the bare handle is not typeable,
    # and ATS URL extraction matches on "linkedin.com/in/", not on a username.
    value: "linkedin.com/in/dom-wuest"
    url: "https://linkedin.com/in/dom-wuest"

  - id: github
    icon: github
    brand: true
    value: "github.com/dom-wuest"
    url: "https://github.com/dom-wuest"

  - id: website
    icon: globe
    value: "dom-wuest.de"
    url: "https://dom-wuest.de"

profile: >
  Informatiker mit Schwerpunkt auf Echtzeit-Computergrafik, GPU-Programmierung 
  und Machine Learning. Praxiserfahrung in C++, Vulkan und Python durch 
  Forschungstätigkeiten am KIT und Fraunhofer IOSB. Interessiert an Neural 
  Rendering, Differentiable Rendering und Computer Vision.

experience:
  - id: fraunhofer-iosb
    role: "Wissenschaftliche Hilfskraft"
    org: "Fraunhofer IOSB"
    location: "Karlsruhe, Deutschland"
    start: "2021-10"
    end: "2026-03"
    highlights:
      - >
        Einsatz von Computer-Vision-Modellen für Objekterkennung, Segmentierung, 
        Bildretrieval und Vision-Language-Embeddings zur Beschleunigung von 
        Structure-from-Motion-Pipelines
      - >
        Integration von Deep-Learning-Modellen in C++ mittels ONNX Runtime und 
        clip.cpp, Konvertierung nach ONNX sowie Anpassungen zur Unterstützung 
        dynamischer Batchgrößen und Bildauflösungen
      - >
        Entwicklung und Auslieferung plattformübergreifender Software sowie 
        Wartung von CI/CD-Pipelines mit GitLab und Docker
    tags: ["C++", "Qt", "OpenCV", "ONNX Runtime"]

  - id: kit-ivd
    role: "Wissenschaftliche Hilfskraft"
    org: "Karlsruher Institut für Technologie (IVD)"
    location: "Karlsruhe, Deutschland"
    start: "2025-05"
    end: "2025-08"
    highlights:
      - >
        Mitwirkung an einer LLM-basierten Pipeline zur Shader-Optimierung durch 
        Integration des Falcor-Renderers und cooperativer Vektor/Matrix-Beschleuniger
      - >
        Entwicklung geeigneter LLM-Prompts sowie automatische Analyse der 
        vorgeschlagenen Optimierungen
      - >
        Co-Autor einer derzeit eingereichten wissenschaftlichen Veröffentlichung
    tags: ["Python", "C++", "Slang"]

  - id: kit-capp
    role: "Studentische Hilfskraft"
    org: "Karlsruher Institut für Technologie (CAPP)"
    location: "Karlsruhe, Deutschland"
    start: "2020-11"
    end: "2021-07"
    highlights:
      - >
        Betreuung einer Übungsgruppe in Technischer Informatik
      - >
        Lehrangebot zu Grundlagen der Mikroelektronik sowie Entwurf und 
        Aufbau digitaler Schaltungen
    tags: ["LaTeX", "C", "Presentations"]

