# yaml-language-server: $schema=../schema/cv.schema.json
#
# Deutscher Lebenslauf.
#
# Struktur, Daten und ids sind identisch zu cv-en.yaml und fertig verdrahtet -
# `uv run cvforge pdf --lang de` baut sofort. Was fehlt, ist die Übersetzung
# der Fließtexte: jede noch englische Stelle ist mit "TODO übersetzen:"
# markiert, sodass sie im PDF sofort ins Auge fällt.
#
# Die englische Originalfassung steht jeweils dahinter - beim Übersetzen
# einfach das "TODO übersetzen: " samt englischem Text ersetzen.
#
# Die drei Fallstricke aus cv-en.yaml gelten unverändert:
#   1. Daten sind ZITIERTE Strings, "YYYY" oder "YYYY-MM".
#   2. `no`/`on`/`off`/`ja` und `note: 1,20` werden von YAML umgedeutet.
#   3. Daten speichern, keine Darstellung: grade: "1,2" + grade_note: current.
#
# private.yaml wird von allen Sprachen geteilt - hier nichts zu tun.

