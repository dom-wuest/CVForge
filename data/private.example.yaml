# Copy this file to data/private.yaml and fill in the real values.
#
#     cp data/private.example.yaml data/private.yaml
#
# data/private.yaml is gitignored and is the ONLY place a real phone number or
# street address may appear. It is shared across all languages, and by the CV
# and the cover letters alike.
#
# It is merged in only for `--profile full` (the default for the PDF).
# `--profile public` - which the HTML target forces - ignores this file
# entirely, even when it exists.
#
# If this file is missing, every build still succeeds; the committed
# placeholders are used and one informational line is printed. A fresh clone
# and CI need no special-casing.

contacts:
  # Keys are the `id` of a contact in data/cv-<lang>.yaml.
  # Only `value` and `url` may be overridden.

  # id: phone is marked `private: hidden` - the committed value is a
  # placeholder and the contact is dropped from the public profile.
  phone:
    value: "+49 721 1234567"
    url: "tel:+491234567"

  # id: location is marked `private: refine` - the committed "Karlsruhe, DE"
  # is publishable, and this refines it for job applications.
  location:
    value: "Musterstraße 1, 76131 Karlsruhe"

# ─── Cover letters ──────────────────────────────────────────────────────────
# Only the letter reads these. The CV has no use for a structured address: it
# prints one line, and `contacts.location` above already is that line.
#
# A letter needs the parts separately, because DIN 5008 puts them on separate
# lines and joins them with a middle dot in the return line above the address
# field. Deriving that by splitting the flat string on commas would work right
# up until an address has a comma in it.
#
# Missing block = the letter still builds, with a visible placeholder address.

address:
  street: "Musterstraße 1"
  postal_code: "76131" # quoted; "01067" would lose its leading zero
  city: "Karlsruhe"
  country: null # printed only when the recipient is abroad

# Your signature scan, as a repo-relative path. assets/private/ is gitignored,
# so the image never enters the repository and this file - which names it - is
# not in the repository either.
#
# A transparent PNG works best; roughly 800px wide from a black-pen scan.
# Missing file or null = the letter prints the typed name alone, which is
# legally just as good for an emailed PDF.
signature: "assets/private/signature.png"
