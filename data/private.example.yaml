# Copy this file to data/private.yaml and fill in the real values.
#
#     cp data/private.example.yaml data/private.yaml
#
# data/private.yaml is gitignored and is the ONLY place a real phone number or
# street address may appear. It is shared across all languages, and by the CV
# and the cover letters alike.
#
# It is merged in only for `--profile full` (the default for the PDF).
# `--profile public` - which the HTML target forces - ignores this file
# entirely, even when it exists.
#
# If this file is missing, every build still succeeds; the committed
# placeholders are used and one informational line is printed. A fresh clone
# and CI need no special-casing.

contacts:
  # Keys are the `id` of a contact in data/cv-<lang>.yaml.
  # Only `value` and `url` may be overridden.

  # id: phone is marked `private: hidden` - the committed value is a
  # placeholder and the contact is dropped from the public profile.
  phone:
    value: "+49 721 1234567"
    url: "tel:+491234567"

  # id: location is marked `private: refine` - the committed "Karlsruhe, DE"
  # is publishable, and this refines it for job applications.
  location:
    value: "Musterstraße 1, 76131 Karlsruhe"
    # The committed url points the map at the city; this one drops the pin on
    # the street address. URL-encode it - %2C for a comma, + for a space - the
    # renderer hands the string to link() untouched.
    url: "https://www.google.com/maps/search/?api=1&query=Musterstra%C3%9Fe+1%2C+76131+Karlsruhe"

# ─── Cover letters ──────────────────────────────────────────────────────────
# Only the letter reads these. The CV has no use for a structured address: it
# prints one line, and `contacts.location` above already is that line.
#
# A letter needs the parts separately, because DIN 5008 puts them on separate
# lines and joins them with a middle dot in the return line above the address
# field. Deriving that by splitting the flat string on commas would work right
# up until an address has a comma in it.
#
# Missing block = the letter still builds, with a visible placeholder address.

address:
  street: "Musterstraße 1"
  postal_code: "76131" # quoted; "01067" would lose its leading zero
  city: "Karlsruhe"
  country: null # printed only when the recipient is abroad

# Your signature scan, as a repo-relative path. assets/private/ is gitignored,
# so the image never enters the repository and this file - which names it - is
# not in the repository either.
#
# A transparent PNG works best; roughly 800px wide from a black-pen scan.
# Missing file or null = the letter prints the typed name alone, which is
# legally just as good for an emailed PDF.
signature: "assets/private/signature.png"

# The documents you attach to applications: diplomas, transcripts, references.
# One declaration each, referenced from any number of letters by `id` - your
# Masterzeugnis is one file on disk however many places you send it.
#
# Declaring them rather than just dropping files in a directory buys two
# things. The sent filename comes from `label`, not from whatever the scanner
# called the file - and scanners produce names like scan_2023_04_11_0003.pdf.
# And `id` is stable, so rescanning or renaming a document does not mean
# editing every letter that attaches it.
#
# Both `file` and `label` take the same shape: one string, or one per
# language. Between them that covers the three kinds of document you actually
# have, and the examples below are one of each:
#
#   one file, one name    a German Zeugnis you send everywhere as it is
#   one file, two names   a bilingual certificate - the document does not
#                         change with the language, only the Anlagen line does
#   two files, two names  a transcript your university issues separately in
#                         German and in English
#
# A letter picks the edition matching its own `meta.lang`. If a document has
# per-language files but not one for that language, the other is attached and
# both the build and `cvforge check` say so - it is still a real document, so
# this is a warning rather than a refusal.
#
# Put the files in assets/private/documents/ - gitignored, like the signature.
# `cvforge apply` copies them into the send folder; `cvforge check` warns about
# one whose file has gone missing, and `apply` refuses to build the folder at
# all rather than produce an incomplete application.

documents:
  # One file, one name. Issued in German, sent as-is to everyone.
  - id: masterzeugnis
    file: "assets/private/documents/masterzeugnis.pdf"
    label: "Masterzeugnis"

  # One file, two names. The certificate itself is bilingual, so there is
  # nothing to switch but the wording in the Anlagen line.
  - id: bachelorzeugnis
    file: "assets/private/documents/bachelorzeugnis.pdf"
    label:
      de: "Bachelorzeugnis"
      en: "Bachelor's Degree Certificate"

  # Two files, two names. The university issues this one per language, so a
  # German application must not receive the English edition.
  - id: transcript-master
    file:
      de: "assets/private/documents/notenauszug_master_de.pdf"
      en: "assets/private/documents/transcript_master_en.pdf"
    label:
      de: "Notenauszug (laufendes Masterstudium)"
      en: "Transcript of Records (Master, in progress)"

  - id: az-xyzgmbh
    file: "assets/private/documents/arbeitszeugnis.pdf"
    label:
      de: "Arbeitszeugnis XYZ GmbH"
      en: "Reference, XYZ GmbH"
